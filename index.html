<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ساحة تحدي الشطرنج الاحترافية</title>

  <!-- Chessboard.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.9);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(ellipse at bottom, #111827, var(--bg-main));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    .top-navbar {
      width: 100%;
      max-width: 980px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 16px;
      margin-bottom: 14px;
    }

    .brand-title {
      font-weight: 800;
      color: var(--accent);
      font-size: 1.1rem;
    }

    .auth-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-profile {
      display: none;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      object-fit: cover;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      font-size: 0.8rem;
      text-align: right;
    }

    .user-name {
      font-weight: 700;
      color: #fff;
    }

    .user-stats {
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    .btn-google {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #1f2937;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 5px 10px;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .arena-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      max-width: 980px;
      width: 100%;
    }

    @media (max-width: 880px) {
      .arena-grid { grid-template-columns: 1fr; }
    }

    .board-container {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    /* طبقة قفل الرقعة في وضع الانتظار */
    .board-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(6px);
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .player-bars-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
    }

    .player-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .top-bar { margin-bottom: 8px; }
    .bottom-bar { margin-top: 8px; }

    .player-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-name {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .captured-pieces {
      display: flex;
      gap: 2px;
      font-size: 1.05rem;
      min-height: 22px;
      align-items: center;
    }

    .advantage-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--accent);
      color: #0b0f19;
      display: none;
    }

    .clock {
      font-size: 1.15rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      padding: 3px 8px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid var(--border);
    }

    .clock.active {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    #board {
      width: 100%;
      max-width: 440px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      direction: ltr;
      user-select: none;
    }

    .highlight-selected { background: rgba(56, 189, 248, 0.55) !important; }
    .highlight-hint { position: relative; }
    .highlight-hint::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 26%; height: 26%;
      background: rgba(16, 185, 129, 0.85);
      border-radius: 50%;
      pointer-events: none;
    }

    .highlight-hint-capture { position: relative; }
    .highlight-hint-capture::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 4px solid rgba(239, 68, 68, 0.85);
      border-radius: 4px;
      pointer-events: none;
    }

    .dashboard-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.7);
      padding: 4px;
      border-radius: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 0.78rem;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0b0f19;
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .tab-content.active { display: flex; }

    .match-status {
      padding: 10px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .match-status.check { color: #fbbf24; border-color: #fbbf24; }
    .match-status.gameover { color: var(--danger); border-color: var(--danger); }

    .input-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      direction: ltr;
      text-align: center;
    }

    .game-actions {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .moves-container {
      flex: 1;
      min-height: 120px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 8px;
      display: flex;
      flex-direction: column;
    }

    .moves-container h3 {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .moves-log {
      flex: 1;
      overflow-y: auto;
      max-height: 120px;
      display: grid;
      grid-template-columns: 28px 1fr 1fr;
      row-gap: 4px;
      column-gap: 6px;
      font-size: 0.8rem;
      direction: ltr;
      text-align: left;
    }

    .move-num { color: var(--text-muted); }

    button {
      padding: 9px;
      font-weight: 700;
      font-size: 0.82rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .btn-primary { background: var(--accent); color: #0b0f19; }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .btn-warning:hover { background: var(--warning); color: #0b0f19; }

    /* النوافذ المنبثقة */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
      max-width: 320px;
      width: 90%;
    }

    .modal-pieces { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }

    .modal-piece-btn {
      width: 55px; height: 55px; font-size: 2rem;
      background: #0f172a; border: 1px solid var(--border);
      border-radius: 8px; color: #fff;
    }
  </style>
</head>
<body>

  <!-- شريط البروفايل العلوي -->
  <div class="top-navbar">
    <div class="brand-title">👑 شطرنج الأبطال</div>

    <div class="auth-section">
      <button class="btn-google" id="googleLoginBtn">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/></svg>
        تسجيل الدخول بجوجل
      </button>

      <div class="user-profile" id="userProfileArea">
        <img class="user-avatar" id="navAvatar" src="" alt="Avatar">
        <div class="user-meta">
          <span class="user-name" id="navUserName">...</span>
          <span class="user-stats">متصل 🟢</span>
        </div>
        <button class="btn-logout" id="logoutBtn">خروج</button>
      </div>
    </div>
  </div>

  <div class="arena-grid">
    <!-- الرقعة واللاعبين -->
    <div class="board-container">
      
      <!-- غطاء الانتظار: يغلق الرقعة حتى اكتمال دخول الخصم -->
      <div class="board-overlay" id="boardOverlay">
        <div class="spinner" id="overlaySpinner" style="display:none;"></div>
        <h3 id="overlayTitle" style="color:var(--accent);">اختر نمط اللعب لبدء التحدي</h3>
        <p id="overlaySubtext" style="color:var(--text-muted); font-size:0.85rem;">يمكنك اختيار أوفلاين، دعوة صديق بكود، أو بحث عشوائي.</p>
        <button class="btn-secondary" id="cancelLobbyBtn" style="display:none; margin-top:8px;">إلغاء والعودة</button>
      </div>

      <div class="player-bars-wrapper" id="playerBarsWrapper">
        
        <div class="player-bar top-bar" id="topBar">
          <div class="player-info">
            <span class="player-name" id="topPlayerName">الخصم</span>
            <div class="captured-pieces" id="topCaptures"></div>
            <span class="advantage-badge" id="topAdvantage">+0</span>
          </div>
          <div class="clock" id="topClock">10:00</div>
        </div>

        <div id="board"></div>

        <div class="player-bar bottom-bar" id="bottomBar">
          <div class="player-info">
            <span class="player-name" id="bottomPlayerName">أنت</span>
            <div class="captured-pieces" id="bottomCaptures"></div>
            <span class="advantage-badge" id="bottomAdvantage">+0</span>
          </div>
          <div class="clock active" id="bottomClock">10:00</div>
        </div>

      </div>
    </div>

    <!-- لوحة التحكم الجانبية -->
    <div class="dashboard-panel">
      <div class="tabs" id="mainTabs">
        <button class="tab-btn active" data-tab="tab-offline">أوفلاين</button>
        <button class="tab-btn" data-tab="tab-friend">مع صديق</button>
        <button class="tab-btn" data-tab="tab-random">عشوائي</button>
      </div>

      <div class="match-status" id="gameStatus">في انتظار بدء اللعب</div>

      <!-- أزرار الإجراءات أثناء اللعب أونلاين -->
      <div class="game-actions" id="onlineActions">
        <button class="btn-warning" id="offerDrawBtn">🤝 عرض تعادل</button>
        <button class="btn-danger" id="resignBtn">🏳️ استسلام</button>
      </div>

      <!-- أوفلاين -->
      <div class="tab-content active" id="tab-offline">
        <button class="btn-primary" id="offlineRestartBtn">بدء مباراة أوفلاين</button>
        <button class="btn-secondary" id="offlineFlipBtn">قلب الرقعة يدوياً</button>
      </div>

      <!-- مع صديق -->
      <div class="tab-content" id="tab-friend">
        <button class="btn-primary" id="createRoomBtn">إنشاء غرفة جديدة</button>
        <div id="roomCodeDisplay" style="display:none; font-size:0.85rem; text-align:center; padding: 8px; background:#0f172a; border-radius:8px;">
          شارك كود الغرفة مع صديقك:<br>
          <b id="generatedRoomCode" style="color:var(--accent); font-size:1.1rem; letter-spacing:2px;"></b>
        </div>
        <hr style="border:0; border-top:1px solid var(--border);">
        <input type="text" id="joinRoomInput" class="input-box" placeholder="أدخل كود الغرفة...">
        <button class="btn-secondary" id="joinRoomBtn">الانضمام للغرفة</button>
      </div>

      <!-- عشوائي -->
      <div class="tab-content" id="tab-random">
        <button class="btn-primary" id="findRandomBtn">🔍 بحث فوري عن منافس عشوائي</button>
        <button class="btn-danger" id="cancelRandomBtn" style="display:none;">إلغاء البحث</button>
      </div>

      <!-- سجل الحركات -->
      <div class="moves-container">
        <h3>سجل الحركات</h3>
        <div class="moves-log" id="movesLog"></div>
      </div>
    </div>
  </div>

  <!-- ترقية البيدق -->
  <div class="modal-overlay" id="promotionModal">
    <div class="modal">
      <h3 style="font-size:0.95rem;">اختر قطعة الترقية</h3>
      <div class="modal-pieces" id="promotionPieces"></div>
    </div>
  </div>

  <!-- نافذة قبول/رفض التعادل -->
  <div class="modal-overlay" id="drawModal">
    <div class="modal">
      <h3 style="font-size:1rem; margin-bottom:8px;">عرض تعادل 🤝</h3>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:14px;">خصمك يعرض عليك إنهاء المباراة بالتعادل، هل توافق؟</p>
      <div style="display:flex; gap:10px;">
        <button class="btn-primary" id="acceptDrawBtn" style="flex:1;">قبول التعادل</button>
        <button class="btn-secondary" id="rejectDrawBtn" style="flex:1;">رفض</button>
      </div>
    </div>
  </div>

  <!-- المكتبات الأساسية -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script>
    // 1. تهيئة Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyADQVr8_-4SW1AO8kUleyIJtpImhyvmTN4",
      authDomain: "chess-1b40d.firebaseapp.com",
      projectId: "chess-1b40d",
      storageBucket: "chess-1b40d.firebasestorage.app",
      messagingSenderId: "476605566755",
      appId: "1:476605566755:web:7a651472e53959d24a0696",
      measurementId: "G-Y30FSX5WCG"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const provider = new firebase.auth.GoogleAuthProvider();

    let currentUser = null;
    let myPlayerId = 'guest_' + Math.random().toString(36).substr(2, 9);

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        myPlayerId = user.uid;
        $('#googleLoginBtn').hide();
        $('#userProfileArea').css('display', 'flex');
        $('#navUserName').text(user.displayName || 'لاعب');
        $('#navAvatar').attr('src', user.photoURL || 'https://via.placeholder.com/36');
        $('#bottomPlayerName').text(user.displayName || 'أنت');

        db.ref('users/' + user.uid).update({
          name: user.displayName,
          email: user.email,
          avatar: user.photoURL,
          lastSeen: Date.now()
        });
      } else {
        currentUser = null;
        $('#googleLoginBtn').show();
        $('#userProfileArea').hide();
        $('#bottomPlayerName').text('أنت');
      }
    });

    $('#googleLoginBtn').on('click', () => {
      auth.signInWithPopup(provider).catch(err => {
        alert('تأكد من فتح الموقع عبر GitHub Pages أو رابط خادم وليس ملف محلي.');
      });
    });

    $('#logoutBtn').on('click', () => auth.signOut());

    // 2. إدارة الشطرنج
    const game = new Chess();
    let board = null;
    let currentMode = 'offline';
    let myColor = 'w';
    let currentRoomId = null;
    let roomRef = null;
    let selectedSquare = null;
    let pendingPromotionMove = null;
    let isMatchActive = false;

    const PIECE_VALUES = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
    const PIECE_SYMBOLS = {
      w: { q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
      b: { q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
    };

    board = Chessboard('board', {
      draggable: false,
      position: 'start',
      orientation: 'white',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    function showOverlay(title, subtext, showSpinner = false, showCancel = false) {
      $('#overlayTitle').text(title);
      $('#overlaySubtext').html(subtext);
      $('#overlaySpinner').toggle(showSpinner);
      $('#cancelLobbyBtn').toggle(showCancel);
      $('#boardOverlay').css('display', 'flex');
      isMatchActive = false;
    }

    function hideOverlay() {
      $('#boardOverlay').hide();
      isMatchActive = true;
    }

    function removeHighlights() {
      $('#board .square-55d63').removeClass('highlight-selected highlight-hint highlight-hint-capture');
    }

    function showHints(moves) {
      moves.forEach(m => {
        const $sq = $('#board .square-' + m.to);
        if (m.captured) $sq.addClass('highlight-hint-capture');
        else $sq.addClass('highlight-hint');
      });
    }

    $('#board').on('click', '.square-55d63', function() {
      if (!isMatchActive) return;
      const square = $(this).data('square');
      onSquareClick(square);
    });

    function onSquareClick(square) {
      if (game.game_over() || !isMatchActive) return;

      if (currentMode !== 'offline' && game.turn() !== myColor) return;

      const piece = game.get(square);
      const isMyPiece = piece && piece.color === game.turn();

      if (!selectedSquare) {
        if (isMyPiece) {
          selectedSquare = square;
          removeHighlights();
          $('#board .square-' + square).addClass('highlight-selected');
          showHints(game.moves({ square: square, verbose: true }));
        }
        return;
      }

      if (selectedSquare === square) {
        selectedSquare = null;
        removeHighlights();
        return;
      }

      if (isMyPiece) {
        selectedSquare = square;
        removeHighlights();
        $('#board .square-' + square).addClass('highlight-selected');
        showHints(game.moves({ square: square, verbose: true }));
        return;
      }

      const moving = game.get(selectedSquare);
      const isWhiteProm = moving.type === 'p' && moving.color === 'w' && square.endsWith('8');
      const isBlackProm = moving.type === 'p' && moving.color === 'b' && square.endsWith('1');

      if (isWhiteProm || isBlackProm) {
        const legal = game.moves({ verbose: true });
        if (legal.some(m => m.from === selectedSquare && m.to === square && m.promotion)) {
          pendingPromotionMove = { from: selectedSquare, to: square };
          openPromotionModal(moving.color);
          return;
        }
      }

      executeMove(selectedSquare, square, 'q');
    }

    function executeMove(from, to, promotion) {
      const move = game.move({ from: from, to: to, promotion: promotion });
      if (move === null) {
        selectedSquare = null;
        removeHighlights();
        return false;
      }

      board.position(game.fen());
      removeHighlights();
      selectedSquare = null;
      updateUI();

      if (currentMode !== 'offline' && roomRef) {
        roomRef.update({
          fen: game.fen(),
          turn: game.turn(),
          lastMove: { from, to, promotion }
        });

        if (game.in_checkmate()) {
          const winnerColor = game.turn() === 'w' ? 'b' : 'w';
          roomRef.update({ status: 'ended', result: `كش مات! فاز ${winnerColor === myColor ? 'أنت' : 'الخصم'}` });
        } else if (game.in_draw()) {
          roomRef.update({ status: 'ended', result: 'تعادل رسمي!' });
        }
      }

      if (currentMode === 'offline' && !game.game_over()) {
        board.orientation(game.turn() === 'w' ? 'white' : 'black');
        syncBarNames();
      }

      return true;
    }

    function openPromotionModal(color) {
      const pieces = ['q', 'r', 'b', 'n'];
      let html = '';
      pieces.forEach(p => {
        html += `<button class="modal-piece-btn" data-piece="${p}">${PIECE_SYMBOLS[color][p]}</button>`;
      });
      $('#promotionPieces').html(html);
      $('#promotionModal').css('display', 'flex');

      $('.modal-piece-btn').off('click').on('click', function() {
        const choice = $(this).data('piece');$('#promotionModal').hide();
        if (pendingPromotionMove) {
          executeMove(pendingPromotionMove.from, pendingPromotionMove.to, choice);
          pendingPromotionMove = null;
        }
      });
    }

    function updateUI() {
      const $status =$('#gameStatus');
      $status.removeClass('check gameover');

      if (game.in_checkmate()) {
        const winner = game.turn() === 'w' ? 'الأسود' : 'الأبيض';
        $status.text(`كش مات! انتصار ${winner}`).addClass('gameover');
      } else if (game.in_draw()) {
        $status.text('تعادل رسمي!').addClass('gameover');
      } else {
        const turnColor = game.turn() === 'w' ? 'الأبيض' : 'الأسود';
        const isMyTurn = (currentMode === 'offline') || (game.turn() === myColor);
        if (game.in_check()) {
          $status.text(`كش ملك! الدور على: ${turnColor} ${isMyTurn ? '(دورك)' : ''}`).addClass('check');
        } else {
          $status.text(`الدور على: ${turnColor} ${isMyTurn ? '(دورك الآن)' : ''}`);
        }
      }

      updateMovesLog();
      calculateAdvantage();
    }

    function updateMovesLog() {
      const history = game.history();
      let logHtml = '';
      for (let i = 0; i < history.length; i += 2) {
        logHtml += `<div class="move-num">${(i/2)+1}.</div><div>${history[i]}</div><div>${history[i+1]||''}</div>`;
      }
      const $log =$('#movesLog');
      $log.html(logHtml);
      $log.scrollTop($log[0].scrollHeight);
    }

    function calculateAdvantage() {
      const boardState = game.board();
      let whiteScore = 0, blackScore = 0;
      const whiteCounts = { p: 0, n: 0, b: 0, r: 0, q: 0 };
      const blackCounts = { p: 0, n: 0, b: 0, r: 0, q: 0 };

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = boardState[r][c];
          if (piece && piece.type !== 'k') {
            if (piece.color === 'w') {
              whiteScore += PIECE_VALUES[piece.type];
              whiteCounts[piece.type]++;
            } else {
              blackScore += PIECE_VALUES[piece.type];
              blackCounts[piece.type]++;
            }
          }
        }
      }

      const baseCount = { p: 8, n: 2, b: 2, r: 2, q: 1 };
      let whiteCaptured = '', blackCaptured = '';
      for (let type in baseCount) {
        const wLost = Math.max(0, baseCount[type] - whiteCounts[type]);
        const bLost = Math.max(0, baseCount[type] - blackCounts[type]);
        for (let i = 0; i < bLost; i++) whiteCaptured += PIECE_SYMBOLS.b[type];
        for (let i = 0; i < wLost; i++) blackCaptured += PIECE_SYMBOLS.w[type];
      }

      if (board.orientation() === 'white') {
        $('#bottomCaptures').html(whiteCaptured);
        $('#topCaptures').html(blackCaptured);
      } else {
        $('#bottomCaptures').html(blackCaptured);
        $('#topCaptures').html(whiteCaptured);
      }
    }

    function syncBarNames(opponentName = 'الخصم') {
      if (currentMode === 'offline') {
        if (board.orientation() === 'white') {
          $('#bottomPlayerName').text('الأبيض');
          $('#topPlayerName').text('الأسود');
        } else {
          $('#bottomPlayerName').text('الأسود');
          $('#topPlayerName').text('الأبيض');
        }
      } else {
        const myName = currentUser ? currentUser.displayName : 'أنت';
        $('#bottomPlayerName').text(myColor === 'w' ? `${myName} (الأبيض)` : `${myName} (الأسود)`);
        $('#topPlayerName').text(myColor === 'w' ? `${opponentName} (الأسود)` : `${opponentName} (الأبيض)`);
      }
    }

    // 3. إدارة التبويبات وأنماط اللعب
    $('.tab-btn').on('click', function() {
      if (isMatchActive && currentMode !== 'offline') {
        if (!confirm('أنت تلعب مباراة أونلاين بالفعل! هل تريد مغادرتها؟')) return;
        leaveCurrentRoom();
      }

      $('.tab-btn').removeClass('active');
      $('.tab-content').removeClass('active');$(this).addClass('active');
      const tab = $(this).data('tab');$('#' + tab).addClass('active');

      if (tab === 'tab-offline') {
        currentMode = 'offline';
        $('#onlineActions').hide();
        showOverlay('مباراة أوفلاين', 'اضغط زر "بدء مباراة أوفلاين" للعب على نفس الجهاز.');
      } else if (tab === 'tab-friend') {
        currentMode = 'friend';
        $('#onlineActions').hide();
        showOverlay('اللعب مع صديق', 'أنشئ غرفة وشارك الكود، أو الصق كود غرفة صديقك للانضمام.');
      } else if (tab === 'tab-random') {
        currentMode = 'random';
        $('#onlineActions').hide();
        showOverlay('البحث العشوائي', 'اضغط زر البحث وسيتم إيصالك بأي منافس يبحث في نفس الوقت فوراً.');
      }
    });

    // نمط 1: أوفلاين
    $('#offlineRestartBtn').on('click', () => {
      leaveCurrentRoom();
      currentMode = 'offline';
      game.reset();
      board.start();
      board.orientation('white');
      syncBarNames();
      updateUI();
      hideOverlay();
      $('#onlineActions').hide();
      $('#gameStatus').text('بدأت مباراة أوفلاين جديدة');
    });

    $('#offlineFlipBtn').on('click', () => {
      board.flip();
      syncBarNames();
      calculateAdvantage();
    });

    // تنظيف ومغادرة أي غرفة سابقة
    function leaveCurrentRoom() {
      if (roomRef) {
        roomRef.off();
        roomRef = null;
      }
      currentRoomId = null;
      isMatchActive = false;
      $('#onlineActions').hide();
    }

    // نمط 2: اللعب مع صديق
    $('#createRoomBtn').on('click', () => {
      leaveCurrentRoom();
      const roomId = 'room_' + Math.floor(100000 + Math.random() * 900000);
      currentRoomId = roomId;
      myColor = 'w';

      game.reset();
      board.start();
      board.orientation('white');

      roomRef = db.ref('rooms/' + roomId);
      
      // إعداد الغرفة والانتظار
      roomRef.set({
        fen: game.fen(),
        turn: 'w',
        status: 'waiting',
        whitePlayer: { id: myPlayerId, name: currentUser ? currentUser.displayName : 'اللاعب 1' },
        blackPlayer: null,
        drawOffer: null
      });

      // التعامل مع انقطاع الاتصال
      roomRef.onDisconnect().update({
        status: 'ended',
        result: 'انسحب اللاعب الأبيض (انقطع الاتصال).'
      });

      $('#generatedRoomCode').text(roomId);
      $('#roomCodeDisplay').show();
      showOverlay('في انتظار صديقك...', `شارك هذا الكود مع صديقك للدخول:<br><b style="color:var(--accent); font-size:1.3rem;">${roomId}</b>`, true, true);

      listenToRoom(roomId);
    });

    $('#joinRoomBtn').on('click', () => {
      const roomId = $('#joinRoomInput').val().trim();
      if (!roomId) return alert('يرجى كتابة كود الغرفة');

      leaveCurrentRoom();
      const targetRef = db.ref('rooms/' + roomId);

      targetRef.once('value', snapshot => {
        if (!snapshot.exists()) return alert('هذه الغرفة غير موجودة');
        const data = snapshot.val();
        if (data.status === 'playing') return alert('هذه الغرفة ممتلئة بالفعل!');

        currentRoomId = roomId;
        roomRef = targetRef;
        myColor = 'b';

        game.reset();
        board.start();
        board.orientation('black');

        // تحديث الغرفة وبدء المباراة
        roomRef.update({
          status: 'playing',
          blackPlayer: { id: myPlayerId, name: currentUser ? currentUser.displayName : 'اللاعب 2' }
        });

        roomRef.onDisconnect().update({
          status: 'ended',
          result: 'انسحب اللاعب الأسود (انقطع الاتصال).'
        });

        listenToRoom(roomId);
      });
    });

    // نمط 3: البحث العشوائي التزامني الموثوق
    $('#findRandomBtn').on('click', () => {
      leaveCurrentRoom();
      $('#findRandomBtn').hide();
      $('#cancelRandomBtn').show();
      showOverlay('جارِ البحث عن منافس عشوائي...', 'يتم التوفيق الآن بينك وبين لاعب آخر...', true, true);

      const queueRef = db.ref('matchmaking_lobby');

      // عملية ذرية (Transaction) لضمان عدم حدوث تضارب بين لاعبين يبحثان معاً
      queueRef.transaction((currentQueue) => {
        if (!currentQueue || currentQueue.status !== 'waiting') {
          // لا يوجد أحد ينتظر، أنا أنشئ غرفة انتظار
          const newRoomId = 'match_' + Math.floor(100000 + Math.random() * 900000);
          return {
            roomId: newRoomId,
            hostId: myPlayerId,
            hostName: currentUser ? currentUser.displayName : 'منافس',
            status: 'waiting'
          };
        } else if (currentQueue.status === 'waiting' && currentQueue.hostId !== myPlayerId) {
          // وجدنا شخصاً ينتظر، ننضم إليه ونغلق القائمة
          const matchedRoom = currentQueue.roomId;
          return {
            roomId: matchedRoom,
            hostId: currentQueue.hostId,
            hostName: currentQueue.hostName,
            peerId: myPlayerId,
            peerName: currentUser ? currentUser.displayName : 'منافس',
            status: 'matched'
          };
        }
        return currentQueue;
      }, (error, committed, snapshot) => {
        if (error) {
          alert('حدث خطأ أثناء البحث، يرجى المحاولة ثانية.');
          resetRandomButtons();
          return;
        }

        const data = snapshot.val();
        if (!data) return;

        if (data.status === 'waiting' && data.hostId === myPlayerId) {
          // أنا المضيف (اللون الأبيض) وأنتظر دخول الطرف الآخر
          currentRoomId = data.roomId;
          roomRef = db.ref('rooms/' + currentRoomId);
          myColor = 'w';

          game.reset();
          board.start();
          board.orientation('white');

          roomRef.set({
            fen: game.fen(),
            turn: 'w',
            status: 'waiting',
            whitePlayer: { id: myPlayerId, name: currentUser ? currentUser.displayName : 'اللاعب 1' },
            blackPlayer: null,
            drawOffer: null
          });

          roomRef.onDisconnect().update({
            status: 'ended',
            result: 'انقطع اتصال الخصم وفزت بالمباراة!'
          });

          // مراقبة الغرفة لتبدأ فور اكتمال الطرف الثاني
          listenToRoom(currentRoomId);

        } else if (data.status === 'matched' && data.peerId === myPlayerId) {
          // تم جمعي كلاعب ثانٍ (اللون الأسود)
          currentRoomId = data.roomId;
          roomRef = db.ref('rooms/' + currentRoomId);
          myColor = 'b';

          game.reset();
          board.start();
          board.orientation('black');

          roomRef.update({
            status: 'playing',
            blackPlayer: { id: myPlayerId, name: currentUser ? currentUser.displayName : 'اللاعب 2' }
          });

          roomRef.onDisconnect().update({
            status: 'ended',
            result: 'انقطع اتصال الخصم وفزت بالمباراة!'
          });

          // تنظيف اللوبي التوافقي
          db.ref('matchmaking_lobby').remove();

          resetRandomButtons();
          listenToRoom(currentRoomId);
        }
      });
    });

    function resetRandomButtons() {
      $('#cancelRandomBtn').hide();
      $('#findRandomBtn').show();
    }

    $('#cancelRandomBtn, #cancelLobbyBtn').on('click', () => {
      if (currentRoomId) {
        db.ref('rooms/' + currentRoomId).remove();
      }
      db.ref('matchmaking_lobby').transaction(current => {
        if (current && current.hostId === myPlayerId) return null;
        return current;
      });
      leaveCurrentRoom();
      resetRandomButtons();
      showOverlay('تم إلغاء البحث', 'يمكنك اختيار نمط اللعب والبدء مجدداً في أي وقت.');
    });

    // 4. مراقبة أحداث الغرفة المشتركة (Moves, Resign, Draw, Disconnect)
    function listenToRoom(roomId) {
      roomRef = db.ref('rooms/' + roomId);

      roomRef.on('value', snapshot => {
        const data = snapshot.val();
        if (!data) return;

        // عند اكتمال دخول الاثنين وبدء المباراة
        if (data.status === 'playing') {
          hideOverlay();
          $('#onlineActions').css('display', 'grid');
          resetRandomButtons();

          const opponent = (myColor === 'w') ? (data.blackPlayer ? data.blackPlayer.name : 'الخصم') : (data.whitePlayer ? data.whitePlayer.name : 'الخصم');
          syncBarNames(opponent);

          if (game.history().length === 0) {
            $('#gameStatus').text(`بدأت المباراة ضد [${opponent}]! أنت تلعب بـ (${myColor === 'w' ? 'الأبيض' : 'الأسود'})`);
          }
        }

        // تحديث النقلات القادمة من الخصم
        if (data.fen && data.fen !== game.fen()) {
          game.load(data.fen);
          board.position(data.fen);
          removeHighlights();
          updateUI();
        }

        // التعامل مع عروض التعادل
        if (data.drawOffer && data.drawOffer !== myColor && data.status === 'playing') {
          $('#drawModal').css('display', 'flex');
        } else {
          $('#drawModal').hide();
        }

        // انتهاء المباراة (كش مات، استسلام، تعادل، انقطاع اتصال)
        if (data.status === 'ended') {
          isMatchActive = false;
          $('#gameStatus').text(data.result).addClass('gameover');
          $('#onlineActions').hide();
          showOverlay('نهاية المباراة 🏁', `<span style="color:#fbbf24; font-size:1.1rem; font-weight:700;">${data.result}</span><br>شكراً لكما على هذه الجولة الحماسية!`, false, false);
          roomRef.off();
        }
      });
    }

    // 5. إجراءات الاستسلام وعرض التعادل
    $('#resignBtn').on('click', () => {
      if (!isMatchActive || !roomRef) return;
      if (confirm('هل أنت متأكد من رغبتك في الاستسلام وإعلان خسارة الجولة؟')) {
        const winner = myColor === 'w' ? 'الأسود' : 'الأبيض';
        roomRef.update({
          status: 'ended',
          result: `استسلم اللاعب ${myColor === 'w' ? 'الأبيض' : 'الأسود'}. فاز ${winner} بالمباراة!`
        });
      }
    });

    $('#offerDrawBtn').on('click', () => {
      if (!isMatchActive || !roomRef) return;
      roomRef.update({ drawOffer: myColor });
      alert('تم إرسال عرض التعادل إلى خصمك، في انتظار رده...');
    });

    $('#acceptDrawBtn').on('click', () => {
      $('#drawModal').hide();
      if (roomRef) {
        roomRef.update({
          status: 'ended',
          result: 'انتهت المباراة بالتعادل باتفاق الطرفين 🤝'
        });
      }
    });

    $('#rejectDrawBtn').on('click', () => {
      $('#drawModal').hide();
      if (roomRef) {
        roomRef.update({ drawOffer: null });
      }
    });

    $(window).resize(board.resize);
    syncBarNames();
    updateUI();
  </script>
</body>
</html>
