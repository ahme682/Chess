<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>منصة الشطرنج - الحسابات واللعب أونلاين</title>

  <!-- Chessboard.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.9);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(ellipse at bottom, #111827, var(--bg-main));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    /* شريط البروفايل العلوي */
    .top-navbar {
      width: 100%;
      max-width: 980px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 16px;
      margin-bottom: 14px;
    }

    .brand-title {
      font-weight: 800;
      color: var(--accent);
      font-size: 1.1rem;
    }

    .auth-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-profile {
      display: none;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      object-fit: cover;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      font-size: 0.8rem;
      text-align: right;
    }

    .user-name {
      font-weight: 700;
      color: #fff;
    }

    .user-stats {
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    .btn-google {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #1f2937;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.2s;
    }

    .btn-google:hover { background: #f1f5f9; }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 5px 10px;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
    }

    /* ساحة اللعب */
    .arena-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      max-width: 980px;
      width: 100%;
    }

    @media (max-width: 880px) {
      .arena-grid { grid-template-columns: 1fr; }
    }

    .board-container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .player-bars-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
    }

    .player-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .top-bar { margin-bottom: 8px; }
    .bottom-bar { margin-top: 8px; }

    .player-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-name {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .captured-pieces {
      display: flex;
      gap: 2px;
      font-size: 1.05rem;
      min-height: 22px;
      align-items: center;
    }

    .advantage-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--accent);
      color: #0b0f19;
      display: none;
    }

    .clock {
      font-size: 1.15rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      padding: 3px 8px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid var(--border);
    }

    .clock.active {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    #board {
      width: 100%;
      max-width: 440px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      direction: ltr;
      user-select: none;
      -webkit-user-select: none;
    }

    .highlight-selected { background: rgba(56, 189, 248, 0.55) !important; }

    .highlight-hint { position: relative; }
    .highlight-hint::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 26%; height: 26%;
      background: rgba(16, 185, 129, 0.85);
      border-radius: 50%;
      pointer-events: none;
    }

    .highlight-hint-capture { position: relative; }
    .highlight-hint-capture::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 4px solid rgba(239, 68, 68, 0.85);
      border-radius: 4px;
      pointer-events: none;
    }

    .dashboard-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.7);
      padding: 4px;
      border-radius: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 0.78rem;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0b0f19;
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .tab-content.active { display: flex; }

    .match-status {
      padding: 10px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .match-status.check { color: #fbbf24; border-color: #fbbf24; }
    .match-status.gameover { color: var(--danger); border-color: var(--danger); }

    .input-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      direction: ltr;
      text-align: center;
    }

    .moves-container {
      flex: 1;
      min-height: 120px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 8px;
      display: flex;
      flex-direction: column;
    }

    .moves-container h3 {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .moves-log {
      flex: 1;
      overflow-y: auto;
      max-height: 120px;
      display: grid;
      grid-template-columns: 28px 1fr 1fr;
      row-gap: 4px;
      column-gap: 6px;
      font-size: 0.8rem;
      direction: ltr;
      text-align: left;
    }

    .move-num { color: var(--text-muted); }

    button {
      padding: 9px;
      font-weight: 700;
      font-size: 0.82rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .btn-primary { background: var(--accent); color: #0b0f19; }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-secondary:hover { background: #475569; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .modal-pieces { display: flex; gap: 10px; margin-top: 12px; }

    .modal-piece-btn {
      width: 55px; height: 55px; font-size: 2rem;
      background: #0f172a; border: 1px solid var(--border);
      border-radius: 8px; color: #fff;
    }
  </style>
</head>
<body>

  <!-- شريط البروفايل العلوي -->
  <div class="top-navbar">
    <div class="brand-title">👑 شطرنج الأبطال</div>

    <div class="auth-section">
      <!-- زر تسجيل الدخول بجوجل -->
      <button class="btn-google" id="googleLoginBtn">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/></svg>
        تسجيل الدخول بجوجل
      </button>

      <!-- الملف الشخصي بعد التسجيل -->
      <div class="user-profile" id="userProfileArea">
        <img class="user-avatar" id="navAvatar" src="" alt="Avatar">
        <div class="user-meta">
          <span class="user-name" id="navUserName">...</span>
          <span class="user-stats">متصل الآن 🟢</span>
        </div>
        <button class="btn-logout" id="logoutBtn">خروج</button>
      </div>
    </div>
  </div>

  <div class="arena-grid">
    <!-- الرقعة واللاعبين -->
    <div class="board-container">
      <div class="player-bars-wrapper" id="playerBarsWrapper">
        
        <div class="player-bar top-bar" id="topBar">
          <div class="player-info">
            <span class="player-name" id="topPlayerName">الخصم</span>
            <div class="captured-pieces" id="topCaptures"></div>
            <span class="advantage-badge" id="topAdvantage">+0</span>
          </div>
          <div class="clock" id="topClock">10:00</div>
        </div>

        <div id="board"></div>

        <div class="player-bar bottom-bar" id="bottomBar">
          <div class="player-info">
            <span class="player-name" id="bottomPlayerName">أنت</span>
            <div class="captured-pieces" id="bottomCaptures"></div>
            <span class="advantage-badge" id="bottomAdvantage">+0</span>
          </div>
          <div class="clock active" id="bottomClock">10:00</div>
        </div>

      </div>
    </div>

    <!-- لوحة التحكم الجانبية -->
    <div class="dashboard-panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="tab-offline">أوفلاين</button>
        <button class="tab-btn" data-tab="tab-friend">مع صديق</button>
        <button class="tab-btn" data-tab="tab-random">عشوائي</button>
      </div>

      <div class="match-status" id="gameStatus">اختر نمط اللعب للبدء</div>

      <!-- أوفلاين -->
      <div class="tab-content active" id="tab-offline">
        <button class="btn-primary" id="offlineRestartBtn">بدء مباراة أوفلاين</button>
        <button class="btn-secondary" id="offlineFlipBtn">قلب الرقعة</button>
      </div>

      <!-- مع صديق -->
      <div class="tab-content" id="tab-friend">
        <button class="btn-primary" id="createRoomBtn">إنشاء غرفة جديدة</button>
        <div id="roomCodeDisplay" style="display:none; font-size:0.85rem; text-align:center; padding: 6px; background:#0f172a; border-radius:6px;">
          كود الغرفة: <b id="generatedRoomCode" style="color:var(--accent);"></b>
        </div>
        <hr style="border:0; border-top:1px solid var(--border);">
        <input type="text" id="joinRoomInput" class="input-box" placeholder="أدخل كود الغرفة...">
        <button class="btn-secondary" id="joinRoomBtn">الانضمام للغرفة</button>
      </div>

      <!-- عشوائي -->
      <div class="tab-content" id="tab-random">
        <button class="btn-primary" id="findRandomBtn">🔍 بحث عن منافس عشوائي</button>
        <button class="btn-secondary" id="cancelRandomBtn" style="display:none; background:var(--danger);">إلغاء البحث</button>
      </div>

      <!-- سجل الحركات -->
      <div class="moves-container">
        <h3>سجل الحركات</h3>
        <div class="moves-log" id="movesLog"></div>
      </div>
    </div>
  </div>

  <!-- ترقية البيدق -->
  <div class="modal-overlay" id="promotionModal">
    <div class="modal">
      <h3 style="font-size:0.95rem;">اختر قطعة الترقية</h3>
      <div class="modal-pieces" id="promotionPieces"></div>
    </div>
  </div>

  <!-- مكتبات اللعبة -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <!-- مكتبات Firebase (App + Database + Auth) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script>
    // 1. إعدادات Firebase الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyADQVr8_-4SW1AO8kUleyIJtpImhyvmTN4",
      authDomain: "chess-1b40d.firebaseapp.com",
      projectId: "chess-1b40d",
      storageBucket: "chess-1b40d.firebasestorage.app",
      messagingSenderId: "476605566755",
      appId: "1:476605566755:web:7a651472e53959d24a0696",
      measurementId: "G-Y30FSX5WCG"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const provider = new firebase.auth.GoogleAuthProvider();

    let currentUser = null;

    // مراقبة الدخول وتسجيل الخروج
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        $('#googleLoginBtn').hide();
        $('#userProfileArea').css('display', 'flex');
        $('#navUserName').text(user.displayName || 'لاعب شطرنج');
        $('#navAvatar').attr('src', user.photoURL || 'https://via.placeholder.com/36');
        $('#bottomPlayerName').text(user.displayName || 'أنت');

        // حفظ بيانات المستخدم
        db.ref('users/' + user.uid).update({
          name: user.displayName,
          email: user.email,
          avatar: user.photoURL,
          lastSeen: Date.now()
        });
      } else {
        currentUser = null;
        $('#googleLoginBtn').show();
        $('#userProfileArea').hide();
        $('#bottomPlayerName').text('أنت');
      }
    });

    $('#googleLoginBtn').on('click', () => {
      auth.signInWithPopup(provider).catch(err => {
        alert('تنبيه: تأكد من تشغيل الصفحة من GitHub Pages أو سيرفر محلي (Live Server) وليس فتح الملف مباشرة.');
      });
    });

    $('#logoutBtn').on('click', () => {
      auth.signOut();
    });

    // 2. منطق الشطرنج
    const game = new Chess();
    let board = null;
    let currentMode = 'offline';
    let myColor = 'w';
    let currentRoomId = null;
    let selectedSquare = null;
    let pendingPromotionMove = null;

    const PIECE_VALUES = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
    const PIECE_SYMBOLS = {
      w: { q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
      b: { q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
    };

    board = Chessboard('board', {
      draggable: false,
      position: 'start',
      orientation: 'white',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    function removeHighlights() {
      $('#board .square-55d63').removeClass('highlight-selected highlight-hint highlight-hint-capture');
    }

    function showHints(moves) {
      moves.forEach(m => {
        const $sq = $('#board .square-' + m.to);
        if (m.captured) $sq.addClass('highlight-hint-capture');
        else $sq.addClass('highlight-hint');
      });
    }

    $('#board').on('click', '.square-55d63', function() {
      const square = $(this).data('square');
      onSquareClick(square);
    });

    function onSquareClick(square) {
      if (game.game_over()) return;

      if (currentMode !== 'offline' && game.turn() !== myColor) return;

      const piece = game.get(square);
      const isMyPiece = piece && piece.color === game.turn();

      if (!selectedSquare) {
        if (isMyPiece) {
          selectedSquare = square;
          removeHighlights();
          $('#board .square-' + square).addClass('highlight-selected');
          showHints(game.moves({ square: square, verbose: true }));
        }
        return;
      }

      if (selectedSquare === square) {
        selectedSquare = null;
        removeHighlights();
        return;
      }

      if (isMyPiece) {
        selectedSquare = square;
        removeHighlights();
        $('#board .square-' + square).addClass('highlight-selected');
        showHints(game.moves({ square: square, verbose: true }));
        return;
      }

      const moving = game.get(selectedSquare);
      const isWhiteProm = moving.type === 'p' && moving.color === 'w' && square.endsWith('8');
      const isBlackProm = moving.type === 'p' && moving.color === 'b' && square.endsWith('1');

      if (isWhiteProm || isBlackProm) {
        const legal = game.moves({ verbose: true });
        if (legal.some(m => m.from === selectedSquare && m.to === square && m.promotion)) {
          pendingPromotionMove = { from: selectedSquare, to: square };
          openPromotionModal(moving.color);
          return;
        }
      }

      executeMove(selectedSquare, square, 'q');
    }

    function executeMove(from, to, promotion) {
      const move = game.move({ from: from, to: to, promotion: promotion });
      if (move === null) {
        selectedSquare = null;
        removeHighlights();
        return false;
      }

      board.position(game.fen());
      removeHighlights();
      selectedSquare = null;
      updateUI();

      if (currentMode !== 'offline' && currentRoomId) {
        db.ref('rooms/' + currentRoomId).update({
          fen: game.fen(),
          turn: game.turn()
        });
      }

      if (currentMode === 'offline' && !game.game_over()) {
        board.orientation(game.turn() === 'w' ? 'white' : 'black');
        syncBarNames();
      }

      return true;
    }

    function openPromotionModal(color) {
      const pieces = ['q', 'r', 'b', 'n'];
      let html = '';
      pieces.forEach(p => {
        html += `<button class="modal-piece-btn" data-piece="${p}">${PIECE_SYMBOLS[color][p]}</button>`;
      });
      $('#promotionPieces').html(html);
      $('#promotionModal').css('display', 'flex');

      $('.modal-piece-btn').off('click').on('click', function() {
        const choice = $(this).data('piece');$('#promotionModal').hide();
        if (pendingPromotionMove) {
          executeMove(pendingPromotionMove.from, pendingPromotionMove.to, choice);
          pendingPromotionMove = null;
        }
      });
    }

    function updateUI() {
      const $status =$('#gameStatus');
      $status.removeClass('check gameover');

      if (game.in_checkmate()) {
        const winner = game.turn() === 'w' ? 'الأسود' : 'الأبيض';
        $status.text(`كش مات! انتصار ${winner}`).addClass('gameover');
      } else if (game.in_draw()) {
        $status.text('تعادل رسمي!').addClass('gameover');
      } else {
        const turnColor = game.turn() === 'w' ? 'الأبيض' : 'الأسود';
        if (game.in_check()) {
          $status.text(`كش ملك! الدور على: ${turnColor}`).addClass('check');
        } else {
          $status.text(`الدور على: ${turnColor}`);
        }
      }

      updateMovesLog();
      calculateAdvantage();
    }

    function updateMovesLog() {
      const history = game.history();
      let logHtml = '';
      for (let i = 0; i < history.length; i += 2) {
        logHtml += `<div class="move-num">${(i/2)+1}.</div><div>${history[i]}</div><div>${history[i+1]||''}</div>`;
      }
      const $log =$('#movesLog');
      $log.html(logHtml);
      $log.scrollTop($log[0].scrollHeight);
    }

    function calculateAdvantage() {
      const boardState = game.board();
      let whiteScore = 0, blackScore = 0;
      const whiteCounts = { p: 0, n: 0, b: 0, r: 0, q: 0 };
      const blackCounts = { p: 0, n: 0, b: 0, r: 0, q: 0 };

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = boardState[r][c];
          if (piece && piece.type !== 'k') {
            if (piece.color === 'w') {
              whiteScore += PIECE_VALUES[piece.type];
              whiteCounts[piece.type]++;
            } else {
              blackScore += PIECE_VALUES[piece.type];
              blackCounts[piece.type]++;
            }
          }
        }
      }

      const baseCount = { p: 8, n: 2, b: 2, r: 2, q: 1 };
      let whiteCaptured = '', blackCaptured = '';
      for (let type in baseCount) {
        const wLost = Math.max(0, baseCount[type] - whiteCounts[type]);
        const bLost = Math.max(0, baseCount[type] - blackCounts[type]);
        for (let i = 0; i < bLost; i++) whiteCaptured += PIECE_SYMBOLS.b[type];
        for (let i = 0; i < wLost; i++) blackCaptured += PIECE_SYMBOLS.w[type];
      }

      if (board.orientation() === 'white') {
        $('#bottomCaptures').html(whiteCaptured);
        $('#topCaptures').html(blackCaptured);
      } else {
        $('#bottomCaptures').html(blackCaptured);
        $('#topCaptures').html(whiteCaptured);
      }
    }

    function syncBarNames() {
      if (currentMode === 'offline') {
        if (board.orientation() === 'white') {
          $('#bottomPlayerName').text('الأبيض');
          $('#topPlayerName').text('الأسود');
        } else {
          $('#bottomPlayerName').text('الأسود');
          $('#topPlayerName').text('الأبيض');
        }
      } else {
        const myName = currentUser ? currentUser.displayName : 'أنت';
        $('#bottomPlayerName').text(myColor === 'w' ? `${myName} (الأبيض)` : `${myName} (الأسود)`);
        $('#topPlayerName').text(myColor === 'w' ? 'الخصم (الأسود)' : 'الخصم (الأبيض)');
      }
    }

    // تبديل الأنماط
    $('.tab-btn').on('click', function() {$('.tab-btn').removeClass('active');
      $('.tab-content').removeClass('active');$(this).addClass('active');
      const tab = $(this).data('tab');$('#' + tab).addClass('active');

      if (tab === 'tab-offline') currentMode = 'offline';
      else if (tab === 'tab-friend') currentMode = 'friend';
      else if (tab === 'tab-random') currentMode = 'random';
    });

    $('#offlineRestartBtn').on('click', () => {
      game.reset();
      board.start();
      board.orientation('white');
      syncBarNames();
      updateUI();
      $('#gameStatus').text('بدأت مباراة أوفلاين');
    });

    $('#offlineFlipBtn').on('click', () => {
      board.flip();
      syncBarNames();
      calculateAdvantage();
    });

    // مع صديق
    $('#createRoomBtn').on('click', () => {
      const roomId = 'room_' + Math.floor(1000 + Math.random() * 9000);
      currentRoomId = roomId;
      myColor = 'w';

      game.reset();
      board.start();
      board.orientation('white');
      syncBarNames();

      db.ref('rooms/' + roomId).set({
        fen: game.fen(),
        turn: 'w',
        status: 'waiting'
      });

      $('#generatedRoomCode').text(roomId);
      $('#roomCodeDisplay').show();
      $('#gameStatus').text('في انتظار الصديق...');
      listenToRoom(roomId);
    });

    $('#joinRoomBtn').on('click', () => {
      const roomId = $('#joinRoomInput').val().trim();
      if (!roomId) return alert('أدخل الكود');

      db.ref('rooms/' + roomId).once('value', snapshot => {
        if (!snapshot.exists()) return alert('الغرفة غير موجودة');
        currentRoomId = roomId;
        myColor = 'b';

        db.ref('rooms/' + roomId).update({ status: 'playing' });
        board.orientation('black');
        syncBarNames();
        $('#gameStatus').text('متصل! تلعب بالأسود');
        listenToRoom(roomId);
      });
    });

    function listenToRoom(roomId) {
      db.ref('rooms/' + roomId).on('value', snapshot => {
        const data = snapshot.val();
        if (!data) return;

        if (data.status === 'playing' && game.history().length === 0) {
          $('#gameStatus').text('بدأت المباراة مع صديقك!');
        }

        if (data.fen && data.fen !== game.fen()) {
          game.load(data.fen);
          board.position(data.fen);
          removeHighlights();
          updateUI();
        }
      });
    }

    // عشوائي
    $('#findRandomBtn').on('click', () => {
      $('#findRandomBtn').hide();
      $('#cancelRandomBtn').show();
      $('#gameStatus').text('جارِ البحث عن منافس...');

      const queueRef = db.ref('matchmaking_queue');
      queueRef.once('value', snapshot => {
        const queue = snapshot.val();
        let matchedRoom = null;

        if (queue) {
          for (let key in queue) {
            if (queue[key].status === 'waiting') {
              matchedRoom = queue[key].roomId;
              queueRef.child(key).remove();
              break;
            }
          }
        }

        if (matchedRoom) {
          currentRoomId = matchedRoom;
          myColor = 'b';
          board.orientation('black');
          syncBarNames();
          db.ref('rooms/' + matchedRoom).update({ status: 'playing' });
          listenToRoom(matchedRoom);
          $('#gameStatus').text('تم العثور على منافس! تلعب بالأسود');
          $('#cancelRandomBtn').hide();
          $('#findRandomBtn').show();
        } else {
          const newRoomId = 'rand_' + Math.floor(1000 + Math.random() * 9000);
          currentRoomId = newRoomId;
          myColor = 'w';
          board.orientation('white');
          syncBarNames();

          game.reset();
          board.start();
          db.ref('rooms/' + newRoomId).set({ fen: game.fen(), turn: 'w', status: 'waiting' });
          const item = queueRef.push({ roomId: newRoomId, status: 'waiting' });

          listenToRoom(newRoomId);

          $('#cancelRandomBtn').off('click').on('click', () => {
            item.remove();
            db.ref('rooms/' + newRoomId).remove();
            $('#cancelRandomBtn').hide();
            $('#findRandomBtn').show();
            $('#gameStatus').text('تم إلغاء البحث');
          });
        }
      });
    });

    $(window).resize(board.resize);
    syncBarNames();
    updateUI();
  </script>
</body>
</html>
