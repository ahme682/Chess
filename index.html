<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ساحة تحدي الشطرنج - التبديل التلقائي</title>

  <!-- Chessboard.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.85);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: radial-gradient(ellipse at bottom, #111827, var(--bg-main));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .arena-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      max-width: 950px;
      width: 100%;
    }

    @media (max-width: 860px) {
      .arena-grid {
        grid-template-columns: 1fr;
      }
    }

    .board-container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .player-bars-wrapper {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
    }

    .player-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    .top-bar {
      margin-bottom: 10px;
    }

    .bottom-bar {
      margin-top: 10px;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-name {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .captured-pieces {
      display: flex;
      gap: 3px;
      font-size: 1.1rem;
      min-height: 24px;
      align-items: center;
    }

    .advantage-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--accent);
      color: #0b0f19;
      display: none;
    }

    .clock {
      font-size: 1.25rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      padding: 4px 10px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid var(--border);
    }

    .clock.active {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    #board {
      width: 100%;
      max-width: 460px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      direction: ltr;
    }

    .dashboard-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .match-status {
      padding: 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      text-align: center;
      font-weight: 600;
      font-size: 1rem;
    }

    .match-status.check {
      color: #fbbf24;
      border-color: #fbbf24;
    }

    .match-status.gameover {
      color: var(--danger);
      border-color: var(--danger);
    }

    .time-selector-card {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .time-selector-card label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
    }

    .time-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .time-btn {
      padding: 6px 4px;
      font-size: 0.8rem;
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .time-btn.active {
      background: var(--accent);
      color: #0b0f19;
      font-weight: 700;
      border-color: var(--accent);
    }

    .custom-time-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .custom-time-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .custom-time-input:focus {
      border-color: var(--accent);
    }

    .setting-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .setting-toggle input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .moves-container {
      flex: 1;
      min-height: 140px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    .moves-container h3 {
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .moves-log {
      flex: 1;
      overflow-y: auto;
      max-height: 140px;
      display: grid;
      grid-template-columns: 32px 1fr 1fr;
      row-gap: 5px;
      column-gap: 6px;
      font-size: 0.85rem;
      padding-right: 4px;
      direction: ltr;
      text-align: left;
    }

    .move-num {
      color: var(--text-muted);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      padding: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #0b0f19;
      grid-column: span 2;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .btn-secondary {
      background: #334155;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .modal h2 {
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .modal-pieces {
      display: flex;
      gap: 12px;
    }

    .modal-piece-btn {
      width: 60px;
      height: 60px;
      font-size: 2.2rem;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .modal-piece-btn:hover {
      background: var(--accent);
      color: #0b0f19;
    }
  </style>
</head>
<body>

  <div class="arena-grid">
    <!-- لوحة اللعب -->
    <div class="board-container">
      <div class="player-bars-wrapper" id="playerBarsWrapper">
        
        <!-- الشريط العلوي -->
        <div class="player-bar top-bar" id="blackBar">
          <div class="player-info">
            <span class="player-name">الأسود</span>
            <div class="captured-pieces" id="blackCaptures"></div>
            <span class="advantage-badge" id="blackAdvantage">+0</span>
          </div>
          <div class="clock" id="blackClock">10:00</div>
        </div>

        <!-- رقعة الشطرنج -->
        <div id="board"></div>

        <!-- الشريط السفلي -->
        <div class="player-bar bottom-bar" id="whiteBar">
          <div class="player-info">
            <span class="player-name">الأبيض</span>
            <div class="captured-pieces" id="whiteCaptures"></div>
            <span class="advantage-badge" id="whiteAdvantage">+0</span>
          </div>
          <div class="clock active" id="whiteClock">10:00</div>
        </div>

      </div>
    </div>

    <!-- لوحة التحكم الجانبية -->
    <div class="dashboard-panel">
      <div class="match-status" id="gameStatus">الدور على: الأبيض</div>

      <!-- إعداد قلب الرقعة التلقائي -->
      <div class="setting-toggle">
        <label for="autoFlipToggle" style="cursor: pointer;">🔄 قلب الرقعة تلقائياً للدور القادم</label>
        <input type="checkbox" id="autoFlipToggle" checked>
      </div>

      <!-- تحديد الوقت -->
      <div class="time-selector-card">
        <label>⏱️ وقت التحدي (لكل لاعب):</label>
        <div class="time-presets">
          <button class="time-btn" data-mins="1">1 دقيقة</button>
          <button class="time-btn" data-mins="3">3 دقائق</button>
          <button class="time-btn" data-mins="5">5 دقائق</button>
          <button class="time-btn active" data-mins="10">10 دقائق</button>
          <button class="time-btn" data-mins="15">15 دقيقة</button>
          <button class="time-btn" data-mins="20">20 دقيقة</button>
          <button class="time-btn" data-mins="30">30 دقيقة</button>
          <button class="time-btn" data-mins="60">ساعة</button>
        </div>
        <div class="custom-time-row">
          <input type="number" id="customMinutes" class="custom-time-input" placeholder="عدد الدقائق يدوياً..." min="1" max="180">
          <button class="btn-secondary" id="applyCustomTimeBtn" style="padding: 6px 12px;">تطبيق</button>
        </div>
      </div>

      <div class="moves-container">
        <h3>سجل النقلات</h3>
        <div class="moves-log" id="movesLog"></div>
      </div>

      <div class="controls">
        <button class="btn-primary" id="restartBtn">بدء / إعادة تشغيل التحدي</button>
        <button class="btn-secondary" id="manualFlipBtn">قلب الرقعة يدوياً</button>
        <button class="btn-secondary" id="pauseClockBtn">إيقاف المؤقت</button>
      </div>
    </div>
  </div>

  <!-- نافذة الترقية -->
  <div class="modal-overlay" id="promotionModal">
    <div class="modal">
      <h2>اختر قطعة الترقية</h2>
      <div class="modal-pieces" id="promotionPieces"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <script>
    const game = new Chess();
    let board = null;

    const PIECE_VALUES = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
    const PIECE_SYMBOLS = {
      w: { q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
      b: { q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
    };

    let selectedMinutes = 10;
    let whiteTime = selectedMinutes * 60;
    let blackTime = selectedMinutes * 60;
    let timerInterval = null;
    let isClockRunning = true;
    let pendingPromotionMove = null;
    let autoFlipEnabled = true;

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60).toString().padStart(2, '0');
      const sec = (seconds % 60).toString().padStart(2, '0');
      return `${min}:${sec}`;
    }

    function setMatchDuration(minutes) {
      selectedMinutes = minutes;
      whiteTime = selectedMinutes * 60;
      blackTime = selectedMinutes * 60;
      $('#whiteClock').text(formatTime(whiteTime));
      $('#blackClock').text(formatTime(blackTime));
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isClockRunning || game.game_over()) return;

        if (game.turn() === 'w') {
          whiteTime--;
          $('#whiteClock').text(formatTime(whiteTime));
          if (whiteTime <= 0) handleTimeOut('w');
        } else {
          blackTime--;
          $('#blackClock').text(formatTime(blackTime));
          if (blackTime <= 0) handleTimeOut('b');
        }
      }, 1000);
    }

    function handleTimeOut(color) {
      clearInterval(timerInterval);
      const winner = color === 'w' ? 'الأسود' : 'الأبيض';
      $('#gameStatus').text(`انتهى الوقت! فاز ${winner}`).addClass('gameover');
    }

    function calculateAdvantage() {
      const boardState = game.board();
      let whiteScore = 0;
      let blackScore = 0;
      const whiteCounts = { p: 0, n: 0, b: 0, r: 0, q: 0 };
      const blackCounts = { p: 0, n: 0, b: 0, r: 0, q: 0 };

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = boardState[r][c];
          if (piece && piece.type !== 'k') {
            if (piece.color === 'w') {
              whiteScore += PIECE_VALUES[piece.type];
              whiteCounts[piece.type]++;
            } else {
              blackScore += PIECE_VALUES[piece.type];
              blackCounts[piece.type]++;
            }
          }
        }
      }

      const baseCount = { p: 8, n: 2, b: 2, r: 2, q: 1 };
      let whiteCapturedHtml = '';
      let blackCapturedHtml = '';

      for (let type in baseCount) {
        const whiteLost = Math.max(0, baseCount[type] - whiteCounts[type]);
        const blackLost = Math.max(0, baseCount[type] - blackCounts[type]);

        for (let i = 0; i < blackLost; i++) whiteCapturedHtml += PIECE_SYMBOLS.b[type];
        for (let i = 0; i < whiteLost; i++) blackCapturedHtml += PIECE_SYMBOLS.w[type];
      }

      $('#whiteCaptures').html(whiteCapturedHtml);
      $('#blackCaptures').html(blackCapturedHtml);

      const diff = whiteScore - blackScore;
      if (diff > 0) {
        $('#whiteAdvantage').text(`+${diff}`).show();
        $('#blackAdvantage').hide();
      } else if (diff < 0) {
        $('#blackAdvantage').text(`+${Math.abs(diff)}`).show();
        $('#whiteAdvantage').hide();
      } else {
        $('#whiteAdvantage').hide();
        $('#blackAdvantage').hide();
      }
    }

    function updateMovesLog() {
      const history = game.history();
      let logHtml = '';
      for (let i = 0; i < history.length; i += 2) {
        const moveNumber = (i / 2) + 1;
        const whiteMove = history[i];
        const blackMove = history[i + 1] || '';
        logHtml += `<div class="move-num">${moveNumber}.</div><div>${whiteMove}</div><div>${blackMove}</div>`;
      }
      const $log =$('#movesLog');
      $log.html(logHtml);
      $log.scrollTop($log[0].scrollHeight);
    }

    // مزامنة اتجاه الرقعة وأشرطة اللاعبين مع اللاعب الحالي
    function updateOrientation(targetOrientation) {
      board.orientation(targetOrientation);

      const $blackBar =$('#blackBar');
      const $whiteBar =$('#whiteBar');
      const $board =$('#board');

      if (targetOrientation === 'white') {
        $blackBar.removeClass('bottom-bar').addClass('top-bar').insertBefore($board);
        $whiteBar.removeClass('top-bar').addClass('bottom-bar').insertAfter($board);
      } else {
        $whiteBar.removeClass('bottom-bar').addClass('top-bar').insertBefore($board);
        $blackBar.removeClass('top-bar').addClass('bottom-bar').insertAfter($board);
      }
    }

    function updateGameState() {
      const $status =$('#gameStatus');
      $status.removeClass('check gameover');

      if (game.in_checkmate()) {
        const winner = game.turn() === 'w' ? 'الأسود' : 'الأبيض';
        $status.text(`كش مات! انتصار ${winner}`).addClass('gameover');
        clearInterval(timerInterval);
      } else if (game.in_draw()) {
        $status.text('تعادل رسمي!').addClass('gameover');
        clearInterval(timerInterval);
      } else {
        const turnColor = game.turn() === 'w' ? 'الأبيض' : 'الأسود';
        if (game.in_check()) {
          $status.text(`كش ملك! الدور على: ${turnColor}`).addClass('check');
        } else {
          $status.text(`الدور على: ${turnColor}`);
        }
      }

      if (game.turn() === 'w') {
        $('#whiteClock').addClass('active');
        $('#blackClock').removeClass('active');
      } else {
        $('#blackClock').addClass('active');
        $('#whiteClock').removeClass('active');
      }

      // تنفيذ القلب التلقائي عند انتهاء النقلة
      if (autoFlipEnabled && !game.game_over()) {
        const nextOrientation = (game.turn() === 'w') ? 'white' : 'black';
        updateOrientation(nextOrientation);
      }

      calculateAdvantage();
      updateMovesLog();
    }

    function onDragStart(source, piece, position, orientation) {
      if (game.game_over()) return false;
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }
    }

    function onDrop(source, target) {
      const piece = game.get(source);
      const isWhitePromotion = piece.type === 'p' && piece.color === 'w' && target.endsWith('8');
      const isBlackPromotion = piece.type === 'p' && piece.color === 'b' && target.endsWith('1');

      if (isWhitePromotion || isBlackPromotion) {
        const legalMoves = game.moves({ verbose: true });
        const canPromote = legalMoves.some(m => m.from === source && m.to === target && m.promotion);
        
        if (canPromote) {
          pendingPromotionMove = { from: source, to: target };
          openPromotionModal(piece.color);
          return;
        }
      }

      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';

      updateGameState();
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    function openPromotionModal(color) {
      const pieces = ['q', 'r', 'b', 'n'];
      let html = '';
      pieces.forEach(p => {
        html += `<button class="modal-piece-btn" data-piece="${p}">${PIECE_SYMBOLS[color][p]}</button>`;
      });
      $('#promotionPieces').html(html);
      $('#promotionModal').css('display', 'flex');

      $('.modal-piece-btn').off('click').on('click', function() {
        const choice = $(this).data('piece');$('#promotionModal').hide();
        if (pendingPromotionMove) {
          game.move({
            from: pendingPromotionMove.from,
            to: pendingPromotionMove.to,
            promotion: choice
          });
          board.position(game.fen());
          pendingPromotionMove = null;
          updateGameState();
        }
      });
    }

    board = Chessboard('board', {
      draggable: true,
      position: 'start',
      orientation: 'white',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    $('.time-btn').on('click', function() {$('.time-btn').removeClass('active');
      $(this).addClass('active');$('#customMinutes').val('');
      const mins = parseInt($(this).data('mins'), 10);
      setMatchDuration(mins);
      restartGame();
    });

    $('#applyCustomTimeBtn').on('click', function() {
      const val = parseInt($('#customMinutes').val(), 10);
      if (val && val > 0) {
        $('.time-btn').removeClass('active');
        setMatchDuration(val);
        restartGame();
      }
    });

    $('#autoFlipToggle').on('change', function() {
      autoFlipEnabled = $(this).is(':checked');
      if (autoFlipEnabled && !game.game_over()) {
        const nextOrientation = (game.turn() === 'w') ? 'white' : 'black';
        updateOrientation(nextOrientation);
      }
    });

    function restartGame() {
      game.reset();
      board.start();
      updateOrientation('white');
      whiteTime = selectedMinutes * 60;
      blackTime = selectedMinutes * 60;
      $('#whiteClock').text(formatTime(whiteTime));
      $('#blackClock').text(formatTime(blackTime));
      isClockRunning = true;
      $('#pauseClockBtn').text('إيقاف المؤقت');
      startTimer();
      updateGameState();
    }

    $('#restartBtn').on('click', restartGame);

    $('#manualFlipBtn').on('click', () => {
      const current = board.orientation();
      updateOrientation(current === 'white' ? 'black' : 'white');
    });

    $('#pauseClockBtn').on('click', function() {
      isClockRunning = !isClockRunning;
      $(this).text(isClockRunning ? 'إيقاف المؤقت' : 'استئناف');
    });

    $(window).resize(board.resize);

    setMatchDuration(10);
    startTimer();
    updateGameState();
  </script>
</body>
</html>
